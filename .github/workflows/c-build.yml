name: C Build Check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Compile C programs
        run: |
          find . -name "*.c" -print0 |
          while IFS= read -r -d '' file; do
            echo "Compiling: $file"
            gcc -Wall -Wextra -Wpedantic "$file" -o /tmp/program
          done
