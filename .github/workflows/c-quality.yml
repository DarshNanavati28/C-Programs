name: C Code Quality

on:
  push:
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Analyze C programs
        run: |
          find . -name "*.c" -print0 |
          while IFS= read -r -d '' file; do
            echo "Analyzing: $file"
            clang --analyze "$file"
          done
